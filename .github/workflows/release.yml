name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests and CLI smoke
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cargo test --locked -- --test-threads=1
          cargo build --release --locked
          test "$(target/release/attx --version)" = "attx ${RELEASE_TAG#v}"
          target/release/attx --help
          target/release/attx doctor --json
      - name: Documentation
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: attx-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: attx-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: attx-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: attx-macos-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Native platform tests
        if: matrix.os != 'macos-latest' || matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked -- --test-threads=1

      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ matrix.artifact }}"
          mkdir -p dist/$OUT
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/attx.exe dist/$OUT/
          else
            cp target/${{ matrix.target }}/release/attx dist/$OUT/
          fi
          cp README.md README.zh-CN.md CHANGELOG.md LICENSE setting.example.toml mkdocs.yml requirements-docs.txt dist/$OUT/
          cp -a skills profiles docs dist/$OUT/
          cd dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a -tzip "$OUT.zip" "$OUT"
          else
            tar -czf "$OUT.tar.gz" "$OUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten packages
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: CHANGELOG.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
