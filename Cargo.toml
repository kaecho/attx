[package]
name = "attx"
version = "0.2.0"
edition = "2024"
description = "Agent Translation Toolkit eXtensible — universal game text translation framework"
license = "MIT"
repository = "https://github.com/emptysuns/attx"
readme = "README.md"
keywords = ["translation", "localization", "rpg-maker", "llm", "game"]
categories = ["command-line-utilities"]

[[bin]]
name = "attx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
