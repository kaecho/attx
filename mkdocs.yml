site_name: attx
site_url: https://kaecho.github.io/attx/
site_description: Agent Translation Toolkit eXtensible
repo_url: https://github.com/kaecho/attx
repo_name: kaecho/attx
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Start: 开始使用
            Install: 安装
            Quick start: 快速开始
            Translate with an agent: Agent 翻译向导
            Configuration: 配置参考
            Workflows: 工作流程
            Translation: 翻译
            Formats: 支持格式
            Custom profiles: 自定义 Profile
            RPG Maker: RPG Maker
            Quality and repair: 质量与修复
            Workspaces and JSONL: 工作区与 JSONL
            Reference: 参考
            CLI: CLI 命令
            Agents: Agent 协议
            Troubleshooting: 故障排查
            Development: 二次开发
            Architecture: 架构
            Extending and releasing: 扩展与发版
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Start: はじめに
            Install: インストール
            Quick start: クイックスタート
            Translate with an agent: Agent 翻訳ガイド
            Configuration: 設定
            Workflows: 使い方
            Translation: 翻訳
            Formats: 対応形式
            Custom profiles: カスタム Profile
            RPG Maker: RPG Maker
            Quality and repair: 品質と修復
            Workspaces and JSONL: ワークスペースと JSONL
            Reference: リファレンス
            CLI: CLI コマンド
            Agents: Agent プロトコル
            Troubleshooting: トラブルシューティング
            Development: 開発
            Architecture: アーキテクチャ
            Extending and releasing: 拡張とリリース

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start:
      - Install: install.md
      - Quick start: quickstart.md
      - Translate with an agent: agent-translation.md
      - Configuration: configuration.md
      - Workflows: usage.md
  - Translation:
      - Formats: formats.md
      - Custom profiles: profiles.md
      - RPG Maker: rmmz.md
      - Quality and repair: quality.md
      - Workspaces and JSONL: workspace.md
  - Reference:
      - CLI: cli.md
      - Agents: agents.md
      - Troubleshooting: troubleshooting.md
  - Development:
      - Architecture: architecture.md
      - Extending and releasing: development.md
