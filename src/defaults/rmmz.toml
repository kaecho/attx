# attx built-in experience for RPG Maker MV/MZ plugin parameters.
#
# Exported from the key tables in `src/adapter/rmmz_plugins.rs` so the baseline
# is visible and overridable instead of buried in source. Embedded in the binary
# via `include_str!`; read it with `attx learn defaults --format rmmz`.
#
# To override one of these, write an entry with the same `field` into
# `$ATTX_HOME/knowledge/rmmz.toml` (global) or `<workspace>/experience.toml`
# (this project only). Later layers win.
#
# Two notes on what these actually do at runtime:
#   * `verdict = "extract"` entries are inert — `knowledge::apply()` can only
#     remove units, never invent them. They document the baseline and give you
#     something concrete to flip to "skip".
#   * `verdict = "skip"` entries duplicate a decision the adapter already made
#     internally, so shipping them changes no behaviour. They exist so you can
#     see the list and override it.
#
# Every entry is scoped to `domain = "plugins"`: the same field names mean
# different things in Map*.json, and an unscoped rule would silently drop
# dialogue.

format = "rmmz"
version = 2

# ---- identity handles and machine data: never translate ----
entry = [
  { kind = "field", verdict = "skip", scope = "any", domain = "plugins", source = "builtin", field = "id", reason = "record id" },
  { kind = "field", verdict = "skip", scope = "any", domain = "plugins", source = "builtin", field = "key", reason = "identity handle referenced verbatim by plugin commands and event scripts" },
