# attx setting.toml
[llm]
default_client = "main"

[[llm.clients]]
name = "main"
provider_type = "openai"
base_url = "https://api.example.com/v1"
api_key = "YOUR_API_KEY"
model = "example-model"
timeout = 600
# temperature = 0.3            # omit: translate 0.3, glossary/learn JSON 0.0
# reasoning_effort = "medium"  # omit: not sent
# max_tokens = 8192            # omit: not sent
# stream = true                # omit: false; SSE delta.content
# extra = { top_p = 0.9 }      # merged last; cannot replace messages

[translation]
worker_count = 8
rpm = 60          # global request rate limit per minute (0 = unlimited)
retry_count = 3
retry_delay = 2
batch_chars = 2500
max_context_items = 6

[glossary]
# Off by default: building a glossary spends extra LLM calls.
# It keeps character/place names consistent across an entire work, which
# matters most for novels and long games.
enabled = false
method = "llm"         # llm = model extracts terms; stats = regex mine + name
min_occurrences = 10   # stats only: appearance floor before naming
max_terms = 200        # cap on terms kept (cost / noise control)
inject_limit = 30      # cap on terms injected into one translation batch

[learn]
auto_summarize = true  # capture experience after writeback (no API cost)
llm_review = false     # also ask the model to check proposals (costs money)
